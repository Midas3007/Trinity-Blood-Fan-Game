# Batch build config (docs/sprite-pipeline.md §4.4). Run: npm run sprites:build
defaults:
  palette: art/palette/requiem48.hex
  method: area
  outline: selective
  dither: false
  min_feature: 2
  gamma: 1.0
  # Texture stage (tools/spritegen/texture.py): violet cloth shadows + local contrast, light dither, rim light.
  grade: 0.7
  dither_strength: 10
  shade: true

entities:
  abel:
    cell: [64, 64]
    sprite_height: 40
    gamma: 1.3            # dark charcoal coat, white piping bright; was 1.5 before the texture stage kept folds visible
    squeeze: 0.88         # narrows the painted source before pixelation for a lankier build (owner pick)
    open_px: 0
    source_dir: art/source/approved/abel/
    output_dir: public/assets/sprites/abel/
    animations:
      reference: { loop: false, durations_ms: 200 }   # turnaround figures, for checking only
      idle:      { loop: true,  durations_ms: [700, 500] }     # 2 key poses: hold, breathe out
      run:       { loop: true,  durations_ms: 110 }            # 4 key poses (contact, down, passing, up)
      jump:      { loop: false, durations_ms: [220, 400] }     # rising, top of the jump
      fall:      { loop: true,  durations_ms: 200 }
      land:      { loop: false, durations_ms: 350 }            # hard landing (matches hardLandingLockMs)
      # Attacks: wind-up for startupMs, strike for activeMs, strike held for recoveryMs (src/data/attacks.json).
      priest1:
        attack: priest1
        sequence: [0, 1, 1]
        durations_ms: [110, 80, 220]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]   # frame = sequence step
      priest2:
        attack: priest2
        sequence: [0, 1, 1]
        durations_ms: [100, 80, 240]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]
      priest3:
        attack: priest3
        sequence: [0, 1, 1]
        durations_ms: [170, 100, 380]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]
      # Revolver finisher: draw, aim, recoil. The shot lands as the recoil frame starts (strikeAtMs in src/data/finishers.json).
      revolver:
        finisher: revolver
        durations_ms: [250, 270, 380]
        events: [{ frame: 2, type: strike }]
      walk:      { loop: true,  durations_ms: 170 }            # calm walk (small stick push)
      climb:     { loop: true,  durations_ms: 180 }            # ladder, seen from behind
      pray:      { loop: false, durations_ms: 1000 }           # kneeling at an altar
      drink:     { loop: false, durations_ms: 700 }            # holy water flask
      # Low postures (one sheet, poses_low_r2). Roll: tucked ball, then kneeling recovery (sum = dodge duration).
      dodge:     { loop: false, durations_ms: [220, 160] }
      slide:     { loop: true,  durations_ms: 200, anchor: centre }   # lying pose: centre on the body, not the forward feet
      crouch:    { loop: true,  durations_ms: 400 }

  abel_crusnik:
    cell: [96, 96]
    sprite_height: 54
    source_dir: art/source/approved/abel_crusnik/
    output_dir: public/assets/sprites/abel_crusnik/
    gamma: 1.5
    animations:
      reference: { loop: false, durations_ms: 1000 }   # side, front, back (design lock; poses come with the Crusnik ability)

  # Crusnik 80% (winged): flight poses for scripted moments and cutscenes (sheet c3c9f3fa).
  abel_crusnik80:
    cell: [128, 128]
    sprite_height: 54
    gamma: 1.5
    source_dir: art/source/approved/abel_crusnik80/
    output_dir: public/assets/sprites/abel_crusnik80/
    animations:
      fly:   { loop: true,  durations_ms: 160 }
      hover: { loop: true,  durations_ms: 600 }
      dive:  { loop: false, durations_ms: 400 }

  # Crusnik 40% (playable form) = the 80% design without wings, derived in code (owner, 2026-10-15).
  abel_crusnik40:
    cell: [96, 96]
    sprite_height: 54
    gamma: 1.5
    source_dir: art/source/approved/abel_crusnik/
    output_dir: public/assets/sprites/abel_crusnik40/
    animations:
      reference:
        source: reference
        pick: [0]                      # side view only (the game is side-on)
        durations_ms: 1000
        # Wing outline on the side-view crop (approved-crop pixels); only dark grey pixels inside are removed.
        keep_largest: true             # drop fragments left floating (scythe tip behind the wing)
      # Playable poses (sheets 28c2f6ce movement, 54dbe26e combat; drawn wingless). Attack timings match attacks.json.
      idle:      { loop: true,  durations_ms: 600 }
      run:       { loop: true,  durations_ms: 140 }
      jump:      { loop: false, durations_ms: 300 }
      fall:      { loop: true,  durations_ms: 200 }
      land:      { loop: false, durations_ms: 300 }
      transform: { loop: false, durations_ms: [300, 350] }   # hunched awakening, then arms spread (= transformMs)
      walk:      { loop: true,  durations_ms: 220 }
      climb:     { loop: true,  durations_ms: 180 }
      guard:     { loop: false, durations_ms: 300 }   # sheet 9c36ce02 (climb redrawn without a ladder, plus these)
      hurt:      { loop: false, durations_ms: 300 }
      crouch:    { loop: false, durations_ms: 300 }
      kneel:     { loop: false, durations_ms: 600 }
      slide:     { loop: true,  durations_ms: 200, anchor: centre }
      scythe:
        attack: scythe
        sequence: [0, 1, 1]
        durations_ms: [160, 100, 260]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]
      lash:
        attack: lash
        sequence: [0, 1, 1]
        durations_ms: [180, 120, 260]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]
        erase: [[[0, 0], [205, 0], [205, 60], [192, 130], [185, 200], [170, 260], [140, 310], [105, 350], [70, 395], [0, 395]]]

  enemy_thrall:
    cell: [64, 64]
    sprite_height: 30
    source_dir: art/source/approved/enemies/thrall/
    output_dir: public/assets/sprites/enemies/thrall/
    animations:
      idle:     { loop: true,  durations_ms: 600 }
      walk:     { loop: true,  durations_ms: 320 }          # played faster while chasing (src/data/enemyAnimations.json)
      # Claw: wind-up for startupMs, strike for activeMs, strike held for recoveryMs (thrall_claw in src/data/enemies.json).
      claw:
        attack: thrall_claw
        sequence: [0, 1, 1]
        durations_ms: [480, 120, 520]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]
      hurt:     { loop: false, durations_ms: 260 }
      collapse: { loop: false, durations_ms: 600, anchor: centre }

  enemy_death_hunter:
    cell: [64, 64]
    sprite_height: 34
    source_dir: art/source/approved/enemies/death_hunter/
    output_dir: public/assets/sprites/enemies/death_hunter/
    animations:
      idle:     { loop: true,  durations_ms: 600 }
      run:      { loop: true,  durations_ms: 140 }           # patrol plays it at 0.6x (src/data/enemyAnimations.json)
      chop:
        attack: hunter_chop
        sequence: [0, 1, 1]
        durations_ms: [420, 110, 480]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]
      hurt:     { loop: false, durations_ms: 200 }
      collapse: { loop: false, durations_ms: 700, anchor: centre }

  enemy_fairy:
    cell: [48, 48]
    sprite_height: 26
    source_dir: art/source/approved/enemies/fairy/
    output_dir: public/assets/sprites/enemies/fairy/
    keep_largest: true
    animations:
      hover:  { loop: true,  durations_ms: 120 }
      scream: { loop: false, durations_ms: [260, 300] }
      dive:   { loop: false, durations_ms: 300 }
      hurt:   { loop: false, durations_ms: 300 }

  # Mini bosses (docs/lore/act1-plan.md). One sheet each: 83ec79c8 (Paula), 4971abd1 (Kampfer), 2df5de55 (Petros).
  boss_paula:
    cell: [112, 96]
    sprite_height: 44
    source_dir: art/source/approved/bosses/paula/
    output_dir: public/assets/sprites/bosses/paula/
    gamma: 0.9
    keep_largest: true
    animations:
      idle:     { loop: true,  durations_ms: 600 }
      dash:     { loop: false, durations_ms: 200 }
      slash1:   { loop: false, durations_ms: 200 }
      slash2:   { loop: false, durations_ms: 200 }
      leap:     { loop: false, durations_ms: 200 }
      defeated: { loop: false, durations_ms: 600 }

  boss_kampfer:
    cell: [128, 112]
    sprite_height: 50
    source_dir: art/source/approved/bosses/kampfer/
    output_dir: public/assets/sprites/bosses/kampfer/
    gamma: 0.9
    keep_largest: true
    animations:
      idle:     { loop: true,  durations_ms: 600 }
      cast:     { loop: false, durations_ms: 300 }
      summon:   { loop: false, durations_ms: 300 }
      vanish:   { loop: false, durations_ms: 300 }
      sweep:    { loop: false, durations_ms: 300 }
      defeated: { loop: false, durations_ms: 600 }

  boss_petros:
    cell: [176, 112]
    sprite_height: 60
    source_dir: art/source/approved/bosses/petros/
    output_dir: public/assets/sprites/bosses/petros/
    keep_largest: true
    animations:
      idle:     { loop: true,  durations_ms: 600 }
      walk:     { loop: true,  durations_ms: 400 }
      windup:   { loop: false, durations_ms: 300 }
      thrust:   { loop: false, durations_ms: 300 }
      charge:   { loop: false, durations_ms: 300 }
      defeated: { loop: false, durations_ms: 600 }

  # Story characters for cutscenes (sheets 9e8b1eed Esther, 14d35b77 Dietrich).
  npc_esther:
    cell: [96, 64]
    sprite_height: 38
    source_dir: art/source/approved/npcs/esther/
    output_dir: public/assets/sprites/npcs/esther/
    gamma: 1.1
    keep_largest: true
    animations:
      stand:     { loop: false, durations_ms: 600 }
      run:       { loop: false, durations_ms: 600 }
      aim:       { loop: false, durations_ms: 600 }
      pray:      { loop: false, durations_ms: 600 }
      collapsed: { loop: false, durations_ms: 600 }
      shock:     { loop: false, durations_ms: 600 }

  npc_dietrich:
    cell: [96, 72]
    sprite_height: 46
    source_dir: art/source/approved/npcs/dietrich/
    output_dir: public/assets/sprites/npcs/dietrich/
    keep_largest: true
    animations:
      stand:   { loop: false, durations_ms: 600 }
      violin:  { loop: false, durations_ms: 600 }
      threads: { loop: false, durations_ms: 600 }
      conduct: { loop: false, durations_ms: 600 }
      laugh:   { loop: false, durations_ms: 600 }
      bow:     { loop: false, durations_ms: 600 }

  enemy_iron_choir:
    cell: [96, 72]
    sprite_height: 42
    source_dir: art/source/approved/enemies/iron_choir/
    output_dir: public/assets/sprites/enemies/iron_choir/
    keep_largest: true
    animations:
      idle:     { loop: true,  durations_ms: 600 }
      walk:     { loop: true,  durations_ms: [260, 260] }
      chop:     { loop: false, durations_ms: [560, 140] }
      block:    { loop: false, durations_ms: 300 }
      collapse: { loop: false, durations_ms: 600 }

  enemy_inquisitor:
    cell: [96, 64]
    sprite_height: 36
    source_dir: art/source/approved/enemies/inquisitor/
    output_dir: public/assets/sprites/enemies/inquisitor/
    keep_largest: true
    animations:
      idle: { loop: true,  durations_ms: 600 }
      walk: { loop: true,  durations_ms: [260, 260] }
      shoot: { loop: false, durations_ms: [520, 120] }
      hurt: { loop: false, durations_ms: 300 }
      down: { loop: false, durations_ms: 600 }

  # Low-born Methuselah (owner, 2026-10-16: blood for the Crusnik meter). Sheet ad588146.
  enemy_methuselah:
    cell: [96, 64]
    sprite_height: 36
    source_dir: art/source/approved/enemies/methuselah/
    output_dir: public/assets/sprites/enemies/methuselah/
    keep_largest: true
    animations:
      idle:     { loop: true,  durations_ms: 600 }
      walk:     { loop: true,  durations_ms: [240, 240] }
      claw:     { loop: false, durations_ms: [420, 140] }
      hurt:     { loop: false, durations_ms: 300 }
      collapse: { loop: false, durations_ms: 700 }

  # Region 2 (sheets 7c4e0f0c marionette, 11c6a7bd Gyula, 09faf2b7 Caterina + envoy).
  boss_marionette:
    cell: [224, 176]
    sprite_height: 112
    source_dir: art/source/approved/bosses/marionette/
    output_dir: public/assets/sprites/bosses/marionette/
    keep_largest: true
    animations:
      idle:     { loop: true,  durations_ms: 700 }
      raise:    { loop: false, durations_ms: 300 }
      slam:     { loop: false, durations_ms: 300 }
      sweep:    { loop: false, durations_ms: 300 }
      collapse: { loop: false, durations_ms: 600 }

  boss_gyula:
    cell: [128, 96]
    sprite_height: 54
    source_dir: art/source/approved/bosses/gyula/
    output_dir: public/assets/sprites/bosses/gyula/
    keep_largest: true
    animations:
      idle:     { loop: true,  durations_ms: 700 }
      thrust:   { loop: false, durations_ms: 300 }
      slash:    { loop: false, durations_ms: 300 }
      star:     { loop: false, durations_ms: 400 }
      hurt:     { loop: false, durations_ms: 300 }
      defeated: { loop: false, durations_ms: 600 }

  npc_caterina:
    cell: [96, 72]
    sprite_height: 44
    source_dir: art/source/approved/npcs/caterina/
    output_dir: public/assets/sprites/npcs/caterina/
    keep_largest: true
    animations:
      stand:  { loop: false, durations_ms: 600 }
      letter: { loop: false, durations_ms: 600 }
      look:   { loop: false, durations_ms: 600 }

  npc_envoy:
    cell: [96, 72]
    sprite_height: 42
    source_dir: art/source/approved/npcs/envoy/
    output_dir: public/assets/sprites/npcs/envoy/
    keep_largest: true
    animations:
      stand: { loop: false, durations_ms: 600 }
      offer: { loop: false, durations_ms: 600 }
      bow:   { loop: false, durations_ms: 600 }

  boss_marchesa:
    cell: [128, 128]
    sprite_height: 60      # duel scale (Crisanta-style): one and a half times Abel
    source_dir: art/source/approved/bosses/marchesa/
    output_dir: public/assets/sprites/bosses/marchesa/
    gamma: 0.85              # lifted: her black and wine gown vanished against the dark ballroom
    keep_largest: true       # the drawn strings break into floating bits at sprite size; strings are drawn in code
    # Sheets d6493192 (stance, walk, slash x2, lunge, staggered) and b9b20ad1 (hang, leap, dive, impact, charge, death).
    animations:
      idle:      { loop: true,  durations_ms: 600 }
      walk:      { loop: true,  durations_ms: 260 }
      slash:     { loop: false, durations_ms: 200 }
      lunge:     { loop: false, durations_ms: 200 }
      staggered: { loop: false, durations_ms: 300 }
      hang:      { loop: true,  durations_ms: 600 }
      leap:      { loop: false, durations_ms: 300 }
      dive:      { loop: false, durations_ms: 300 }
      impact:    { loop: false, durations_ms: 300 }
      charge:    { loop: false, durations_ms: 300 }
      death:     { loop: false, durations_ms: 600 }
