# Batch build config (docs/sprite-pipeline.md §4.4). Run: npm run sprites:build
defaults:
  palette: art/palette/requiem48.hex
  method: area
  outline: selective
  dither: false
  min_feature: 2
  gamma: 1.0

entities:
  abel:
    cell: [64, 64]
    sprite_height: 40
    gamma: 1.5            # darkens the charcoal coat to near-black while white piping stays bright (owner pick, round 3)
    squeeze: 0.88         # narrows the painted source before pixelation for a lankier build (owner pick)
    open_px: 0
    source_dir: art/source/approved/abel/
    output_dir: public/assets/sprites/abel/
    animations:
      reference: { loop: false, durations_ms: 200 }   # turnaround figures, for checking only
      idle:      { loop: true,  durations_ms: [700, 500] }     # 2 key poses: hold, breathe out
      run:       { loop: true,  durations_ms: 110 }            # 4 key poses (contact, down, passing, up)
      jump:      { loop: false, durations_ms: [220, 400] }     # rising, top of the jump
      fall:      { loop: true,  durations_ms: 200 }
      land:      { loop: false, durations_ms: 350 }            # hard landing (matches hardLandingLockMs)
      # Attacks: wind-up for startupMs, strike for activeMs, strike held for recoveryMs (src/data/attacks.json).
      priest1:
        attack: priest1
        sequence: [0, 1, 1]
        durations_ms: [110, 80, 220]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]   # frame = sequence step
      priest2:
        attack: priest2
        sequence: [0, 1, 1]
        durations_ms: [100, 80, 240]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]
      priest3:
        attack: priest3
        sequence: [0, 1, 1]
        durations_ms: [170, 100, 380]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]
      # Revolver finisher: draw, aim, recoil. The shot lands as the recoil frame starts (strikeAtMs in src/data/finishers.json).
      revolver:
        finisher: revolver
        durations_ms: [250, 270, 380]
        events: [{ frame: 2, type: strike }]
      # Low postures (one sheet, poses_low_r2). Roll: tucked ball, then kneeling recovery (sum = dodge duration).
      dodge:     { loop: false, durations_ms: [220, 160] }
      slide:     { loop: true,  durations_ms: 200, anchor: centre }   # lying pose: centre on the body, not the forward feet
      crouch:    { loop: true,  durations_ms: 400 }

  abel_crusnik:
    cell: [96, 96]
    sprite_height: 54
    source_dir: art/source/approved/abel_crusnik/
    output_dir: public/assets/sprites/abel_crusnik/
    gamma: 1.5
    animations:
      reference: { loop: false, durations_ms: 1000 }   # side, front, back (design lock; poses come with the Crusnik ability)

  # Crusnik 40% (playable form) = the 80% design without wings, derived in code (owner, 2026-10-15).
  abel_crusnik40:
    cell: [96, 96]
    sprite_height: 54
    gamma: 1.5
    source_dir: art/source/approved/abel_crusnik/
    output_dir: public/assets/sprites/abel_crusnik40/
    animations:
      reference:
        source: reference
        pick: [0]                      # side view only (the game is side-on)
        durations_ms: 1000
        # Wing outline on the side-view crop (approved-crop pixels); only dark grey pixels inside are removed.
        keep_largest: true             # drop fragments left floating (scythe tip behind the wing)
        erase: [[[0, 0], [205, 0], [205, 60], [192, 130], [185, 200], [170, 260], [140, 310], [105, 350], [70, 395], [0, 395]]]

  enemy_thrall:
    cell: [64, 64]
    sprite_height: 30
    source_dir: art/source/approved/enemies/thrall/
    output_dir: public/assets/sprites/enemies/thrall/
    animations:
      idle:     { loop: true,  durations_ms: 600 }
      walk:     { loop: true,  durations_ms: 320 }          # played faster while chasing (src/data/enemyAnimations.json)
      # Claw: wind-up for startupMs, strike for activeMs, strike held for recoveryMs (thrall_claw in src/data/enemies.json).
      claw:
        attack: thrall_claw
        sequence: [0, 1, 1]
        durations_ms: [480, 120, 520]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]
      hurt:     { loop: false, durations_ms: 260 }
      collapse: { loop: false, durations_ms: 600, anchor: centre }

  enemy_death_hunter:
    cell: [64, 64]
    sprite_height: 34
    source_dir: art/source/approved/enemies/death_hunter/
    output_dir: public/assets/sprites/enemies/death_hunter/
    animations:
      idle:     { loop: true,  durations_ms: 600 }
      run:      { loop: true,  durations_ms: 140 }           # patrol plays it at 0.6x (src/data/enemyAnimations.json)
      chop:
        attack: hunter_chop
        sequence: [0, 1, 1]
        durations_ms: [420, 110, 480]
        events: [{ frame: 1, type: hitbox_on }, { frame: 2, type: hitbox_off }]
      hurt:     { loop: false, durations_ms: 200 }
      collapse: { loop: false, durations_ms: 700, anchor: centre }

  boss_marchesa:
    cell: [128, 128]
    sprite_height: 96
    source_dir: art/source/approved/bosses/marchesa/
    output_dir: public/assets/sprites/bosses/marchesa/
    animations: {}
