name: CI

on:
  push:
  pull_request:

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tools/spritegen/requirements.txt
      - run: python3 -E -s -m unittest discover -s tools/spritegen/tests -t .
      - run: python3 -E -s -m tools.spritegen validate public/assets/sprites --palette art/palette/requiem48.hex
